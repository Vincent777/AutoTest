# llm_perf_dashboard — Ascend 上跑 vLLM / SGLang 性能
# 流程：
#   1) 并发 vLLM_Perf / SGLang_Perf → SSH 到 106 resolve + daemon
#   2) 从共享目录取 Excel，作为 artifacts 上传
#      /home/s_limingge/.npu_locks/artifacts/CI_ascend_test/${CI_JOB_ID}/performance
#   3) IngestPerfResults：SSH 到 106，把共享目录 Excel 写入正式长期 db
#
# 与 SmokeTest 一致：image 用 docker:stable（自带 ssh，无需 apt/pip）。
# Runner 需挂载共享目录，例如 config.toml:
#   volumes = ["/home/s_limingge/.npu_locks/artifacts:/home/s_limingge/.npu_locks/artifacts:ro"]

stages:
  - test
  - ingest

variables:
  LLM_PERF_DIR: ${CI_PROJECT_DIR}/llm_perf_dashboard
  SHARED_PERF_ARTIFACTS: /home/s_limingge/.npu_locks/artifacts/CI_ascend_test
  TEST_HOST: ci_test@192.168.100.106
  DASHBOARD_HOST: s_limingge@192.168.100.106
  DASHBOARD_DIR: /home/s_limingge/ci_autotest/llm_perf_dashboard
  DASHBOARD_DB: /home/s_limingge/ci_autotest/llm_perf_dashboard/storage/perf.db

# 与 SmokeTest-aarch64-ascend 相同写法
.setup_ssh: &setup_ssh
  before_script:
    - mkdir -p ~/.ssh
    - |
      if [ -z "${TESTSERVER_SSH_KEY}" ]; then
        echo "ERROR: TESTSERVER_SSH_KEY is empty (cp would get '')."
        echo "Settings → CI/CD → Variables: add File variable TESTSERVER_SSH_KEY"
        echo "(uncheck Protected if this branch/tag is not protected)."
        exit 1
      fi
    - cp "$TESTSERVER_SSH_KEY" ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

.perf_job_template: &perf_job_template
  <<: *setup_ssh
  stage: test
  image: docker:stable
  timeout: 5 hour

vLLM_Perf-aarch64-ascend:
  <<: *perf_job_template
  variables:
    MODEL_LIST:
      value: "DeepSeek-R1-Distill-Qwen-32B"
    ENGINE_NAME: vLLM
  script:
    - echo "vLLM Performance Test starting..."
    - echo "MODEL_LIST = $MODEL_LIST"
    - |
      set -e
      if [ ! -d "${SHARED_PERF_ARTIFACTS}" ]; then
        echo "WARN: ${SHARED_PERF_ARTIFACTS} not visible in job container."
        echo "Mount it in gitlab-runner config.toml volumes."
      fi
      ENGINE_KEY="$(echo "${ENGINE_NAME}" | tr '[:upper:]' '[:lower:]')"
      echo "ENGINE_KEY = $ENGINE_KEY"
      # resolve + daemon 都在 106 上跑（docker:stable 无 python，与 SmokeTest 一样只做 SSH）
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${TEST_HOST}" "
        set -em
        cd /home/ci_test
        mkdir -p Ascend_910_Test
        cd Ascend_910_Test
        mkdir ${CI_JOB_ID}
        cd ${CI_JOB_ID}
        git init
        git remote add origin http://git.xcoresigma.com/xcore-sigma/autotest.git
        git fetch --depth=1 origin main
        git show origin/main:llm_perf_dashboard/runners/common/resolve_release.py > resolve_release.py
        git show origin/main:llm_perf_dashboard/configs/engines.yaml > engines.yaml
        ENGINE_VERSION=\$(python3 resolve_release.py --engine ${ENGINE_KEY} --config engines.yaml --field tag)
        echo \"Resolved ENGINE_VERSION = \$ENGINE_VERSION\"
        git show origin/main:ascend_test_suite/daemon.sh > daemon.sh
        chmod a+x daemon.sh
        ./daemon.sh \
          Ascend \
          Performance \
          ${ENGINE_NAME} \
          ${MODEL_LIST} \
          ${CI_JOB_ID} \
          Random \
          \$ENGINE_VERSION
      "
      export ENGINE_KEY
      sh "${LLM_PERF_DIR}/runners/fetch_ci_reports.sh"
  artifacts:
    when: always
    paths:
      - llm_perf_dashboard/ci_reports/vllm/
    expire_in: 14 days
  tags:
    - "910_ascend_for_vllm_perf"

SGLang_Perf-aarch64-ascend:
  <<: *perf_job_template
  variables:
    MODEL_LIST:
      value: "DeepSeek-R1-Distill-Qwen-32B"
    ENGINE_NAME: SGLang
  script:
    - echo "SGLang Performance Test starting..."
    - echo "MODEL_LIST = $MODEL_LIST"
    - |
      set -e
      if [ ! -d "${SHARED_PERF_ARTIFACTS}" ]; then
        echo "WARN: ${SHARED_PERF_ARTIFACTS} not visible in job container."
        echo "Mount it in gitlab-runner config.toml volumes."
      fi
      ENGINE_KEY="$(echo "${ENGINE_NAME}" | tr '[:upper:]' '[:lower:]')"
      echo "ENGINE_KEY = $ENGINE_KEY"
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${TEST_HOST}" "
        set -em
        cd /home/ci_test
        mkdir -p Ascend_910_Test
        cd Ascend_910_Test
        mkdir ${CI_JOB_ID}
        cd ${CI_JOB_ID}
        git init
        git remote add origin http://git.xcoresigma.com/xcore-sigma/autotest.git
        git fetch --depth=1 origin main
        git show origin/main:llm_perf_dashboard/runners/common/resolve_release.py > resolve_release.py
        git show origin/main:llm_perf_dashboard/configs/engines.yaml > engines.yaml
        ENGINE_VERSION=\$(python3 resolve_release.py --engine ${ENGINE_KEY} --config engines.yaml --field tag)
        echo \"Resolved ENGINE_VERSION = \$ENGINE_VERSION\"
        git show origin/main:ascend_test_suite/daemon.sh > daemon.sh
        chmod a+x daemon.sh
        ./daemon.sh \
          Ascend \
          Performance \
          ${ENGINE_NAME} \
          ${MODEL_LIST} \
          ${CI_JOB_ID} \
          Random \
          \$ENGINE_VERSION
      "
      export ENGINE_KEY
      sh "${LLM_PERF_DIR}/runners/fetch_ci_reports.sh"
  artifacts:
    when: always
    paths:
      - llm_perf_dashboard/ci_reports/sglang/
    expire_in: 14 days
  tags:
    - "910_ascend_for_sglang_perf"

IngestPerfResults:
  <<: *setup_ssh
  stage: ingest
  image: docker:stable
  needs:
    - job: vLLM_Perf-aarch64-ascend
      artifacts: true
    - job: SGLang_Perf-aarch64-ascend
      artifacts: true
  script:
    - |
      set -e
      echo "Ingest shared-dir Excel into formal dashboard db on 106"
      VLLM_JOB_ID="$(ls -1 "${LLM_PERF_DIR}/ci_reports/vllm" 2>/dev/null | head -n 1)"
      SGLANG_JOB_ID="$(ls -1 "${LLM_PERF_DIR}/ci_reports/sglang" 2>/dev/null | head -n 1)"
      echo "VLLM_JOB_ID=${VLLM_JOB_ID}"
      echo "SGLANG_JOB_ID=${SGLANG_JOB_ID}"
      echo "SHARED=${SHARED_PERF_ARTIFACTS}"
      echo "DB=${DASHBOARD_DB}"
      if [ -z "${VLLM_JOB_ID}" ] || [ -z "${SGLANG_JOB_ID}" ]; then
        echo "ERROR: cannot resolve job ids from ci_reports artifacts" >&2
        find "${LLM_PERF_DIR}/ci_reports" -type f | sort || true
        exit 1
      fi
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${DASHBOARD_HOST}" "
        set -e
        cd ${DASHBOARD_DIR}
        python3 -m pip install -q -r requirements.txt
        bash runners/ingest_ci_reports.sh \
          --shared-root ${SHARED_PERF_ARTIFACTS} \
          --job-ids ${VLLM_JOB_ID},${SGLANG_JOB_ID} \
          --db ${DASHBOARD_DB}
      "
  tags:
    - "910_ascend_for_vllm_perf"
