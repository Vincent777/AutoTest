# llm_perf_dashboard — Ascend 上每周跑 vLLM / SGLang release 性能并展示
# 挂到现有 GitLab；在调度器里新建 Pipeline Schedule（建议每周 2 次）
# 需要 runner tag: 910_ascend（与 ascend_test_suite 一致）

stages:
  - perf
  - publish

variables:
  LLM_PERF_DIR: ${CI_PROJECT_DIR}/llm_perf_dashboard
  ASCEND_RT_VISIBLE_DEVICES: "0"
  ENGINES: "vllm,sglang"

.ssh_setup: &ssh_setup
  before_script:
    - mkdir -p ~/.ssh
    - cp "$TESTSERVER_SSH_KEY" ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

# 手动或 Schedule 触发：在 910 机器上拉最新 release 并跑测
WeeklyPerf-ascend:
  stage: perf
  <<: *ssh_setup
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
  variables:
    ARCH: aarch64-ascend
  script:
    - echo "Weekly Ascend LLM perf starting..."
    - |
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null s_limingge@192.168.100.106 "
        set -e
        if [ ! -d /home/s_limingge/ci_autotest ]; then
          git clone http://git.xcoresigma.com/xcore-sigma/autotest.git ci_autotest
        else
          cd /home/s_limingge/ci_autotest
          git fetch --all
          git reset --hard origin/main
          git pull origin main
        fi
        cd /home/s_limingge/ci_autotest/llm_perf_dashboard
        python3 -m pip install -q -r requirements.txt
        export ASCEND_RT_VISIBLE_DEVICES='${ASCEND_RT_VISIBLE_DEVICES}'
        export ENGINES='${ENGINES}'
        bash runners/run_weekly.sh
      "
  timeout: 8 hours
  tags:
    - "910_ascend"
  artifacts:
    when: always
    paths:
      - llm_perf_dashboard/artifacts/
      - llm_perf_dashboard/storage/perf.db
    expire_in: 90 days

# 可选：在有结果的机器上起 WebUI（长期服务建议用 systemd，而不是 CI job）
PublishDashboard-manual:
  stage: publish
  when: manual
  <<: *ssh_setup
  script:
    - |
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null s_limingge@192.168.100.106 "
        cd /home/s_limingge/ci_autotest/llm_perf_dashboard
        python3 -m pip install -q -r requirements.txt
        # 后台起 API；生产环境请换成 systemd / docker
        nohup python3 -m uvicorn api.main:app --host 0.0.0.0 --port 8088 > artifacts/api.log 2>&1 &
        echo Dashboard: http://192.168.100.106:8088/
      "
  tags:
    - "910_ascend"
