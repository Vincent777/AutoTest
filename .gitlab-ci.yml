# llm_perf_dashboard — Ascend 上跑 vLLM / SGLang 性能
# 流程：
#   1) 并发 vLLM_Perf / SGLang_Perf → resolve_release → 触发测试
#   2) 从共享目录取 Excel，作为 artifacts 上传（供 CI 页面下载）
#      /home/s_limingge/.npu_locks/artifacts/CI_ascend_test/${CI_JOB_ID}/performance
#   3) IngestPerfResults：SSH 到 106，把共享目录 Excel 写入正式长期 db
#
# 注意：现网 Runner 为 shell executor（image 会被忽略），不要 apt-get；
# 共享目录需在 Runner 宿主机/容器启动时已挂载可见。

stages:
  - test
  - ingest

variables:
  LLM_PERF_DIR: ${CI_PROJECT_DIR}/llm_perf_dashboard
  SHARED_PERF_ARTIFACTS: /home/s_limingge/.npu_locks/artifacts/CI_ascend_test
  # 协调机：发起 daemon（实际 Performance 在 Ascend 集群空闲节点上跑）
  TEST_HOST: ci_test@192.168.100.106
  # 正式 dashboard（仅 IngestPerfResults 使用）
  DASHBOARD_HOST: s_limingge@192.168.100.106
  DASHBOARD_DIR: /home/s_limingge/ci_autotest/llm_perf_dashboard
  DASHBOARD_DB: /home/s_limingge/ci_autotest/llm_perf_dashboard/storage/perf.db

.perf_job_template: &perf_job_template
  stage: test
  before_script:
    - |
      set -e
      command -v ssh >/dev/null || { echo "ERROR: ssh not found on shell runner"; exit 1; }
      command -v python3 >/dev/null || { echo "ERROR: python3 not found on shell runner"; exit 1; }
      python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user -q pyyaml
      mkdir -p ~/.ssh
      cp "$TESTSERVER_SSH_KEY" ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      if [ ! -d "${SHARED_PERF_ARTIFACTS}" ]; then
        echo "WARN: ${SHARED_PERF_ARTIFACTS} not visible on this runner."
        echo "Mount shared artifacts into the gitlab-runner environment."
      fi
  timeout: 5 hour

vLLM_Perf-aarch64-ascend:
  <<: *perf_job_template
  variables:
    MODEL_LIST:
      value: "DeepSeek-R1-Distill-Qwen-32B"
    ENGINE_NAME: vLLM
  script:
    - echo "vLLM Performance Test starting..."
    - echo "MODEL_LIST = $MODEL_LIST"
    - |
      set -e
      ENGINE_KEY="$(echo "${ENGINE_NAME}" | tr '[:upper:]' '[:lower:]')"
      RESOLVER="${LLM_PERF_DIR}/runners/common/resolve_release.py"
      RESOLVED="$(python3 "$RESOLVER" --engine "$ENGINE_KEY" --json)"
      IMAGE="$(printf '%s' "$RESOLVED" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["image"])')"
      ENGINE_VERSION="$(printf '%s' "$RESOLVED" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["tag"])')"
      echo "ENGINE_KEY = $ENGINE_KEY"
      echo "Resolved IMAGE = $IMAGE"
      echo "Resolved ENGINE_VERSION (daemon version arg) = $ENGINE_VERSION"
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${TEST_HOST}" "
        set -m
        cd /home/ci_test
        if [ ! -d Ascend_910_Test ];then
          mkdir -p Ascend_910_Test
        fi
        cd Ascend_910_Test
        mkdir ${CI_JOB_ID}
        cd ${CI_JOB_ID}
        git init
        git remote add origin http://git.xcoresigma.com/xcore-sigma/autotest.git
        git fetch --depth=1 origin main
        git show origin/main:ascend_test_suite/daemon.sh > daemon.sh
        chmod a+x daemon.sh
        ./daemon.sh \
          Performance \
          ${ENGINE_NAME} \
          ${MODEL_LIST} \
          ${CI_JOB_ID} \
          Random \
          ${ENGINE_VERSION}
      "
      # 从共享目录取 Excel（不再 scp 106）
      export ENGINE_KEY
      bash "${LLM_PERF_DIR}/runners/fetch_ci_reports.sh"
  artifacts:
    when: always
    paths:
      - llm_perf_dashboard/ci_reports/vllm/
    expire_in: 14 days
  tags:
    - "910_ascend_for_vllm_perf"

SGLang_Perf-aarch64-ascend:
  <<: *perf_job_template
  variables:
    MODEL_LIST:
      value: "DeepSeek-R1-Distill-Qwen-32B"
    ENGINE_NAME: SGLang
  script:
    - echo "SGLang Performance Test starting..."
    - echo "MODEL_LIST = $MODEL_LIST"
    - |
      set -e
      ENGINE_KEY="$(echo "${ENGINE_NAME}" | tr '[:upper:]' '[:lower:]')"
      RESOLVER="${LLM_PERF_DIR}/runners/common/resolve_release.py"
      RESOLVED="$(python3 "$RESOLVER" --engine "$ENGINE_KEY" --json)"
      IMAGE="$(printf '%s' "$RESOLVED" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["image"])')"
      ENGINE_VERSION="$(printf '%s' "$RESOLVED" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["tag"])')"
      echo "ENGINE_KEY = $ENGINE_KEY"
      echo "Resolved IMAGE = $IMAGE"
      echo "Resolved ENGINE_VERSION (daemon version arg) = $ENGINE_VERSION"
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${TEST_HOST}" "
        set -m
        cd /home/ci_test
        if [ ! -d Ascend_910_Test ];then
          mkdir -p Ascend_910_Test
        fi
        cd Ascend_910_Test
        mkdir ${CI_JOB_ID}
        cd ${CI_JOB_ID}
        git init
        git remote add origin http://git.xcoresigma.com/xcore-sigma/autotest.git
        git fetch --depth=1 origin main
        git show origin/main:ascend_test_suite/daemon.sh > daemon.sh
        chmod a+x daemon.sh
        ./daemon.sh \
          Performance \
          ${ENGINE_NAME} \
          ${MODEL_LIST} \
          ${CI_JOB_ID} \
          Random \
          ${ENGINE_VERSION}
      "
      export ENGINE_KEY
      bash "${LLM_PERF_DIR}/runners/fetch_ci_reports.sh"
  artifacts:
    when: always
    paths:
      - llm_perf_dashboard/ci_reports/sglang/
    expire_in: 14 days
  tags:
    - "910_ascend_for_sglang_perf"

# 仅本 step 调整：无 GitLab artifacts；SSH 到 106 从共享目录入库正式 db
IngestPerfResults:
  stage: ingest
  needs:
    - job: vLLM_Perf-aarch64-ascend
      artifacts: true
    - job: SGLang_Perf-aarch64-ascend
      artifacts: true
  before_script:
    - |
      set -e
      command -v ssh >/dev/null || { echo "ERROR: ssh not found on shell runner"; exit 1; }
      mkdir -p ~/.ssh
      cp "$TESTSERVER_SSH_KEY" ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
  script:
    - |
      set -e
      echo "Ingest shared-dir Excel into formal dashboard db on 106"
      # 从上一步 artifacts 目录名解析各自 CI_JOB_ID（不改动上方 job）
      VLLM_JOB_ID="$(find "${LLM_PERF_DIR}/ci_reports/vllm" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n 1)"
      SGLANG_JOB_ID="$(find "${LLM_PERF_DIR}/ci_reports/sglang" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n 1)"
      echo "VLLM_JOB_ID=${VLLM_JOB_ID}"
      echo "SGLANG_JOB_ID=${SGLANG_JOB_ID}"
      echo "SHARED=${SHARED_PERF_ARTIFACTS}"
      echo "DB=${DASHBOARD_DB}"
      if [ -z "${VLLM_JOB_ID}" ] || [ -z "${SGLANG_JOB_ID}" ]; then
        echo "ERROR: cannot resolve job ids from ci_reports artifacts" >&2
        find "${LLM_PERF_DIR}/ci_reports" -type f | sort || true
        exit 1
      fi
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${DASHBOARD_HOST}" "
        set -e
        cd ${DASHBOARD_DIR}
        python3 -m pip install -q -r requirements.txt
        bash runners/ingest_ci_reports.sh \
          --shared-root ${SHARED_PERF_ARTIFACTS} \
          --job-ids ${VLLM_JOB_ID},${SGLANG_JOB_ID} \
          --db ${DASHBOARD_DB}
      "
  tags:
    - "910_ascend_for_vllm_perf"
